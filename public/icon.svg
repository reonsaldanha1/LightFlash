<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8db" stop-opacity="1"/>
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="#090d16"/>
  
  <!-- Outer Bezel Ring -->
  <circle cx="256" cy="256" r="210" fill="url(#bodyGrad)" stroke="#475569" stroke-width="6"/>
  <circle cx="256" cy="256" r="185" fill="#0d1117" stroke="#f59e0b" stroke-width="4" stroke-dasharray="14 10"/>
  
  <!-- Ambient Lens Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#lensGlow)"/>

  <!-- Tactical Flashlight Silhouette & Beam -->
  <g filter="url(#neonGlow)">
    <!-- Light cone projection -->
    <polygon points="256,120 170,350 342,350" fill="url(#beamGrad)" opacity="0.35"/>
    
    <!-- Flashlight icon / Bolt symbol -->
    <path d="M276 96 L196 264 L244 264 L236 416 L316 248 L268 248 Z" fill="#fbbf24" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  </g>
  
  <!-- Corner Tactical Rivets -->
  <circle cx="80" cy="80" r="8" fill="#334155" stroke="#64748b" stroke-width="3"/>
  <circle cx="432" cy="80" r="8" fill="#334155" stroke="#64748b" stroke-width="3"/>
  <circle cx="80" cy="432" r="8" fill="#334155" stroke="#64748b" stroke-width="3"/>
  <circle cx="432" cy="432" r="8" fill="#334155" stroke="#64748b" stroke-width="3"/>
</svg>
